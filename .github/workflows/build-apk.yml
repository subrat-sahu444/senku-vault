name: Build Senku Vault APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build APK with Gradle
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SenkuVault-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenkuVault-v1.0-APK
          path: build-output/SenkuVault-v1.0.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Senku Vault Android APK v1.0.0"
          body: |
            ### 🧪 Senku Vault Android App (APK)
            **10 Billion Percent Exhilarating Media Downloader**
            
            - 📸 **Instagram Reels & Posts**: Download original CDN videos & carousels.
            - ⚡ **YouTube 4K & MP3 Studio**: Full quality video & audio downloads.
            - 💬 **WhatsApp Status Saver**: Direct status gallery & 1-click saver.
            - 🛡️ **Zero Advertising**: Pure Kingdom of Science streaming.
            
            #### 📥 Download & Install
            Click **`SenkuVault-v1.0.apk`** below to download directly to your Android device, then tap to install!
          files: build-output/SenkuVault-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
