<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="senkuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Slate Container -->
  <rect width="64" height="64" rx="16" fill="#060c14" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(0, 255, 136, 0.25)" stroke-width="1.5" />
  
  <!-- Atomic Orbits -->
  <ellipse cx="32" cy="34" rx="26" ry="10" fill="none" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1" transform="rotate(-30 32 34)" />
  <ellipse cx="32" cy="34" rx="26" ry="10" fill="none" stroke="rgba(255, 215, 0, 0.35)" stroke-width="1" transform="rotate(30 32 34)" />
  
  <!-- Scientific Erlenmeyer Flask -->
  <g filter="url(#emeraldGlow)">
    <!-- Flask Outline -->
    <path d="M28 14 L36 14 L36 24 L48 44 C49.5 46.5 47.5 50 44.5 50 L19.5 50 C16.5 50 14.5 46.5 16 44 L28 24 Z" 
          fill="none" stroke="url(#senkuGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Flask Neck Lip -->
    <line x1="26" y1="14" x2="38" y2="14" stroke="url(#senkuGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Glowing Chemical Liquid inside -->
    <path d="M22 34 L42 34 L46 42 C47 44 45.5 47 43 47 L21 47 C18.5 47 17 44 18 42 Z" fill="url(#flaskLiquid)" />
    <!-- Bubbles / Exhilarating Sparks -->
    <circle cx="32" cy="38" r="2.5" fill="#fff" />
    <circle cx="27" cy="42" r="1.5" fill="#fff" opacity="0.8" />
    <circle cx="37" cy="41" r="1.8" fill="#ffd700" />
    <circle cx="32" cy="20" r="1.5" fill="#00ff88" />
  </g>
</svg>
